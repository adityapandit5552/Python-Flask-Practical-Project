{% extends 'base.html' %}

{% block title %}Reset Password | Cloud Deployment Lab{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card">
        <h2 class="card-title">Reset Password</h2>
        <p class="card-subtitle">Enter your account Username or Email to update your password</p>

        <form action="{{ url_for('reset_password') }}" method="POST">
            <div class="form-group">
                <label for="identifier" class="form-label">Username or Email</label>
                <input type="text" id="identifier" name="identifier" class="form-control" placeholder="username or email" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="new_password" class="form-label">New Password</label>
                <input type="password" id="new_password" name="new_password" class="form-control" placeholder="••••••••" required>
            </div>

            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm New Password</label>
                <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Update Password</button>
        </form>

        <div class="form-footer">
            Remembered your password? <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
