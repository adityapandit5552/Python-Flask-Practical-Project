{% extends 'base.html' %}

{% block title %}User Login | Cloud Deployment Lab{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="glass-card">
        <h2 class="card-title">User Login</h2>
        <p class="card-subtitle">Enter your credentials to access your dashboard</p>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username_or_email" class="form-label">Username or Email</label>
                <input type="text" id="username_or_email" name="username_or_email" class="form-control" placeholder="username or email" required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>
        </form>

        <div class="form-footer">
            <p><a href="{{ url_for('reset_password') }}">Forgot Password?</a></p>
            <p style="margin-top: 0.5rem;">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
        </div>
    </div>
</div>
{% endblock %}
